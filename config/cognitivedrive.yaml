project:
  mode: research_demonstrator
  advisory_only: true
camera:
  width: 640
  height: 480
  fps: 30
  source: realsense
perception:
  detector: yolo
  model: yolo11n.pt
  confidence: 0.25
  depth_center_ratio: 0.50
tracking:
  history_frames: 60
uncertainty:
  unknown_threshold: 0.60
auto_label:
  min_track_frames: 30
  min_confidence: 0.85
  min_temporal_consistency: 0.90
  min_model_agreement: 0.80
memory:
  backend: sqlite
  path: data/memory/episodes.sqlite3
  top_k: 3
  min_similarity: 0.70
validation:
  max_old_class_recall_drop: 0.01
  max_calibration_error: 0.08
  max_latency_ms: 80.0
  min_shadow_agreement: 0.90
safety:
  real_vehicle_actuation: false
